<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>2019 Lexus LS 500 Base - Abuja Cars</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              blue: '#0052FF',
              hover: '#0043D1',
            }
          }
        },
      },
    }
  </script>
</head>
<body class="bg-white font-sans text-gray-900 antialiased selection:bg-blue-600 selection:text-white">

  <header class="w-full border-b border-gray-100 bg-white sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-8 h-20 flex items-center justify-between">
      
      <a href="#" class="font-bold text-xl tracking-tight text-gray-900">Abuja Cars</a>

      <nav class="hidden md:flex items-center space-x-8 text-sm font-medium text-gray-600">
        <a href="#" class="hover:text-gray-900 transition">Home</a>
        <a href="#" class="text-gray-900 font-semibold border-b-2 border-gray-900 pb-1">Inventory</a>
        <div class="relative group cursor-pointer flex items-center gap-1 hover:text-gray-900 transition">
          <span>Manage Car</span>
          <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </div>
        <a href="#" class="hover:text-gray-900 transition">Electric Cars</a>
      </nav>

      <div class="flex items-center space-x-4">
        <a href="#" class="bg-brand-blue hover:bg-brand-hover text-white text-xs sm:text-sm font-semibold px-5 py-2.5 rounded-full transition shadow-sm">
          Sell through us
        </a>
        <button class="md:hidden text-gray-700 focus:outline-none">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
        </button>
      </div>

    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-8 py-6">

    <div class="mb-6">
      <a href="#" class="w-10 h-10 rounded-full border border-gray-200 flex items-center justify-center text-gray-600 hover:bg-gray-50 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
      </a>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-stretch mb-10">
      
      <div class="lg:col-span-5 bg-gray-50/70 border border-gray-100 rounded-3xl p-6 sm:p-8 flex flex-col justify-between order-2 lg:order-1">
        <div>
          <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 tracking-tight">2019 Lexus LS 500 Base</h1>
          <p class="text-xl sm:text-2xl font-bold text-gray-900 mt-1">$42,000</p>

          <dl class="mt-6 space-y-2 text-xs sm:text-sm">
            <div class="flex"><dt class="text-gray-500 w-32">Color:</dt><dd class="font-semibold text-gray-900">Green</dd></div>
            <div class="flex"><dt class="text-gray-500 w-32">Trim:</dt><dd class="font-semibold text-gray-900">500 Base</dd></div>
            <div class="flex"><dt class="text-gray-500 w-32">Exterior Color:</dt><dd class="font-semibold text-gray-900">Black</dd></div>
            <div class="flex"><dt class="text-gray-500 w-32">Interior Color:</dt><dd class="font-semibold text-gray-900">Black</dd></div>
            <div class="flex"><dt class="text-gray-500 w-32">Mileage:</dt><dd class="font-semibold text-gray-900">25,789</dd></div>
            <div class="flex"><dt class="text-gray-500 w-32">Transmission:</dt><dd class="font-semibold text-gray-900">Automatic</dd></div>
            <div class="flex"><dt class="text-gray-500 w-32">Stock:</dt><dd class="font-semibold text-gray-900">A1232212</dd></div>
            <div class="flex"><dt class="text-gray-500 w-32">Body Style:</dt><dd class="font-semibold text-gray-900">4D Sedan</dd></div>
          </dl>
        </div>

        <div class="mt-8">
          <button class="bg-brand-blue hover:bg-brand-hover text-white text-sm font-semibold px-6 py-3 rounded-full transition shadow-md w-full sm:w-auto">
            Check Availability
          </button>
        </div>
      </div>

      <div class="lg:col-span-7 relative rounded-3xl overflow-hidden min-h-[300px] sm:min-h-[420px] bg-gray-100 order-1 lg:order-2 group">
        <img 
          src="https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&q=80&w=1200" 
          alt="2019 Lexus LS 500 Base Main View" 
          class="w-full h-full object-cover"
        />
        
        <button class="absolute left-4 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/40 text-white backdrop-blur-md flex items-center justify-center hover:bg-black/60 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <button class="absolute right-4 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/40 text-white backdrop-blur-md flex items-center justify-center hover:bg-black/60 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </button>
      </div>

    </div>

    <div class="flex items-center space-x-2 border-b border-gray-100 pb-4 mb-8 overflow-x-auto scrollbar-none">
      <button class="px-5 py-2 text-xs sm:text-sm font-medium text-gray-500 hover:text-gray-900 rounded-full transition">Description</button>
      <button class="px-5 py-2 text-xs sm:text-sm font-medium text-gray-500 hover:text-gray-900 rounded-full transition">Options</button>
      <button class="px-5 py-2 text-xs sm:text-sm font-semibold text-brand-blue bg-blue-50 rounded-full">Images</button>
      <button class="px-5 py-2 text-xs sm:text-sm font-medium text-gray-500 hover:text-gray-900 rounded-full transition">Contact</button>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-12">
      
      <div class="rounded-2xl overflow-hidden h-64 bg-gray-100 group">
        <img src="https://images.unsplash.com/photo-1542282088-72c9c27ed0cd?auto=format&fit=crop&q=80&w=800" alt="Detail 1" class="w-full h-full object-cover group-hover:scale-105 transition duration-300"/>
      </div>
      
      <div class="rounded-2xl overflow-hidden h-64 bg-gray-100 group">
        <img src="https://images.unsplash.com/photo-1563720223185-11003d516935?auto=format&fit=crop&q=80&w=800" alt="Detail 2" class="w-full h-full object-cover group-hover:scale-105 transition duration-300"/>
      </div>
      
      <div class="rounded-2xl overflow-hidden h-64 bg-gray-100 group">
        <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=800" alt="Detail 3" class="w-full h-full object-cover group-hover:scale-105 transition duration-300"/>
      </div>

      <div class="rounded-2xl overflow-hidden h-64 bg-gray-100 group">
        <img src="https://images.unsplash.com/photo-1583121274602-3e2820c69888?auto=format&fit=crop&q=80&w=800" alt="Detail 4" class="w-full h-full object-cover group-hover:scale-105 transition duration-300"/>
      </div>

      <div class="rounded-2xl overflow-hidden h-64 bg-gray-100 group">
        <img src="https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&q=80&w=800" alt="Detail 5" class="w-full h-full object-cover group-hover:scale-105 transition duration-300"/>
      </div>

      <div class="rounded-2xl overflow-hidden h-64 bg-gray-100 group">
        <img src="https://images.unsplash.com/photo-1617788138017-80ad40651399?auto=format&fit=crop&q=80&w=800" alt="Detail 6" class="w-full h-full object-cover group-hover:scale-105 transition duration-300"/>
      </div>

      <div class="rounded-2xl overflow-hidden h-64 bg-gray-100 group">
        <img src="https://images.unsplash.com/photo-1605559424843-9e4c228bf1c2?auto=format&fit=crop&q=80&w=800" alt="Detail 7" class="w-full h-full object-cover group-hover:scale-105 transition duration-300"/>
      </div>

      <div class="rounded-2xl overflow-hidden h-64 bg-gray-100 group">
        <img src="https://images.unsplash.com/photo-1616422285623-13ff0162193c?auto=format&fit=crop&q=80&w=800" alt="Detail 8" class="w-full h-full object-cover group-hover:scale-105 transition duration-300"/>
      </div>

      <div class="rounded-2xl overflow-hidden h-64 bg-gray-100 group">
        <img src="https://images.unsplash.com/photo-1590362891991-f776e747a588?auto=format&fit=crop&q=80&w=800" alt="Detail 9" class="w-full h-full object-cover group-hover:scale-105 transition duration-300"/>
      </div>

    </div>

    <div class="flex items-center justify-center space-x-2 pt-4 pb-12">
      <button class="w-9 h-9 rounded-full border border-gray-200 flex items-center justify-center text-gray-500 hover:bg-gray-50 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
      </button>
      
      <button class="w-9 h-9 rounded-full bg-brand-blue text-white font-semibold text-xs sm:text-sm">1</button>
      <button class="w-9 h-9 rounded-full text-gray-600 hover:bg-gray-100 font-medium text-xs sm:text-sm transition">2</button>
      <button class="w-9 h-9 rounded-full text-gray-600 hover:bg-gray-100 font-medium text-xs sm:text-sm transition">3</button>
      <span class="text-gray-400 px-1">...</span>
      
      <button class="w-9 h-9 rounded-full border border-gray-200 flex items-center justify-center text-gray-500 hover:bg-gray-50 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
      </button>
    </div>

  </main>

</body>
</html>
